# Fortune Button: standalone lights and sound on the ESPHome Starter Kit.
# Keep components/ beside this file. Behaviour lives in fortune_button.h/.cpp.
# The LEDs form a closed ring; the component owns both ring and buzzer.
substitutions:
  button_pin: GPIO6
  buzzer_pin: GPIO18
  pixel_pin: GPIO14
  pixel_count: "10"
  accessory_power_pin: GPIO4

esphome:
  name: fortune-button
  friendly_name: Fortune Button
  on_shutdown:
    - switch.turn_off: accessory_power

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: components
    components: [fortune_button]

# No network or OTA: flash over USB-C. If you add wifi and api, set both
# reboot_timeout values to 0s so disconnection cannot interrupt the toy.

# GPIO4 enables +3V3_CTRL, the buzzer supply. Bring it up before outputs.
switch:
  - platform: gpio
    pin: ${accessory_power_pin}
    id: accessory_power
    restore_mode: ALWAYS_ON
    setup_priority: 2000
    internal: true

output:
  - platform: ledc
    pin: ${buzzer_pin}
    id: buzzer

light:
  - platform: esp32_rmt_led_strip
    id: led_ring
    internal: true
    pin: ${pixel_pin}
    num_leds: ${pixel_count}
    chipset: WS2812
    channel_colors: GRB
    rmt_symbols: 48

binary_sensor:
  - platform: gpio
    id: ask_button
    internal: true
    pin:
      number: ${button_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms

fortune_button:
  light: led_ring
  output: buzzer
  button: ask_button
  yes_percent: 50
